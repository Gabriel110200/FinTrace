<div class="home-container">

  <mat-grid-list cols="12" rowHeight="60px">
    <mat-grid-tile colspan="12"></mat-grid-tile>
  </mat-grid-list>

  <mat-card class="cardCampos" appearance="outlined">

    <mat-grid-list cols="12" rowHeight="50px">
      <mat-grid-tile colspan="12">
        <div class="ajustetxte">
          <button mat-fab class="iconeRetorno" (click)="home()">
            <mat-icon>arrow_back</mat-icon>
          </button>
        </div>
        <div class="ajustetxtd">
          <button mat-raised-button (click)="dialogCadastroMeta('para Meta')" class="botaoTopo">Adicionar a Meta</button>
          <button mat-raised-button (click)="dialogNovaMeta()" class="botaoTopo">Cadastrar Metas</button>
        </div>
        <div class="ajustetxtd">
        </div>
      </mat-grid-tile>
  </mat-grid-list>

    <mat-card-header>
        <br><br>
    </mat-card-header>

    <mat-card-content>

      <app-tabelaMetas
        [tipoMetas]="tipoMetas"
        (atualizacaoMeta)="atualizaLista($event)"
      ></app-tabelaMetas>

    </mat-card-content>

    <mat-card-footer>
    </mat-card-footer>
  </mat-card>

</div>
